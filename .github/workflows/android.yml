
name: Build RobotTech APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential

      - name: Setup Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install buildozer cython==0.29.36

      
      - name: Build APK
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          cython --version
          yes | buildozer -v android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RobotTech-APK
          path: bin/*.apk
          if-no-files-found: error
